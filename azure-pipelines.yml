trigger:
  - main

pool:
  vmImage: ubuntu-latest

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.12'
    displayName: 'Use Python 3.12'

  - script: |
      python -m pip install --upgrade pip
      python -m pip install -r requirements.txt
    displayName: 'Install dependencies'

  - script: |
      python -m pytest --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=test-results.xml
    displayName: 'Run tests and generate coverage'

  - task: PublishTestResults@2
    displayName: 'Publish test results'
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: 'test-results.xml'
      testRunTitle: 'Python Unit Tests'
      failTaskOnFailedTests: true

  - task: PublishCodeCoverageResults@2
    displayName: 'Publish code coverage'
    inputs:
      summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage.xml'
      pathToSources: '$(System.DefaultWorkingDirectory)'
      failIfCoverageEmpty: true

  - script: |
      mkdir -p "$(Build.ArtifactStagingDirectory)/test-reports"
      cp "$(System.DefaultWorkingDirectory)/coverage.xml" "$(Build.ArtifactStagingDirectory)/test-reports/"
      cp "$(System.DefaultWorkingDirectory)/test-results.xml" "$(Build.ArtifactStagingDirectory)/test-reports/"
    displayName: 'Stage test and coverage reports'

  - task: PublishPipelineArtifact@1
    displayName: 'Publish test and coverage artifacts'
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/test-reports'
      artifact: 'test-reports'
      publishLocation: 'pipeline'
